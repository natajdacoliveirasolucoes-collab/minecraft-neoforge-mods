plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'com.nata.mekataczcompat'
base { archivesName = 'MekaTaCZCompat' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run-smoke')
            jvmArgument '-Xmx2G'
        }
    }
    mods {
        mekataczcompat { sourceSet sourceSets.main }
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    compileOnly files('deps/Mekanism-1.21.1-10.7.19.85.jar')
    compileOnly files('deps/tacz-neoforge-1.21.1-1.1.8-hotfix-r7.jar')
    localRuntime files('deps/Mekanism-1.21.1-10.7.19.85.jar')
    localRuntime files('deps/tacz-neoforge-1.21.1-1.1.8-hotfix-r7.jar')
}
if (project.hasProperty('renderSmoke')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
}
tasks.named('jar') { exclude 'com/nata/mekataczcompat/smoke/**' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
