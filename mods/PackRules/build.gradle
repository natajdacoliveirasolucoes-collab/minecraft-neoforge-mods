plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'com.tandy.packrules'
base { archivesName = 'PackRules' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies {
    compileOnly files('deps/mobchampions-1.21.1-neoforge-1.0.2.2-NEOFORGE.jar')
    compileOnly files('deps/whitenoise-inspection.jar')
}
