plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'com.tandy.playerenginefork'
base { archivesName = 'PlayerEngineAuthFork' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories { mavenCentral() }

dependencies {
    implementation 'org.ow2.asm:asm:9.10.1'
}
tasks.register('forkPlayerEngine', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tandy.playerenginefork.BuildFork'
    args file('upstream/playerengine-neoforge-1.21.1-1.4.0.jar'),
         file('build/fork/playerengine-neoforge-1.21.1-1.4.0-authnotices.2.jar'),
         file('build/classes/java/main/com/player2/playerengine/player2api/auth/AuthNoticeBridge.class'),
         file('src/main/java')
}
tasks.named('build') { dependsOn tasks.named('forkPlayerEngine') }
